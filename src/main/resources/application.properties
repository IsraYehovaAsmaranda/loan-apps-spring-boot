spring.application.name=livecode-loan-app
server.port=8080

spring.datasource.username=${ADATASME_USERNAME:postgres}
spring.datasource.password=${DATASME_PASSWORD:123}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loan_db}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=Asia/Jakarta
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta
jwt.secret=sjvsdvbdvodfkvbdvfkvbdvfjkvbodvnfjdbvoaid#vodvdjv  # Ganti dengan secret key yang kuat (minimal 32 karakter)
jwt.expiration=86400           # Contoh: 86400 detik = 1 hari
spring.redis.host=localhost
spring.redis.port=6379